name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to exact commits so a moved tag can't change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Publish only the public site, never tools or repo files
      - name: Collect public files
        run: |
          mkdir _site
          cp index.html boot.js script.js styles.css logo.svg apple-touch-icon.png og.png Harsh-Vardhan-Chauhan-Resume.pdf _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          [ -f robots.txt ] && cp robots.txt _site/ || true
          [ -f 404.html ] && cp 404.html _site/ || true
          cp -r classic v2 _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
